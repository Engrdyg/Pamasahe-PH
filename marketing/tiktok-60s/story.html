<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8" />
<!--
  Bayad Po — TikTok promo (60 s, 1080×1920, 30 fps).
  Deterministic timeline: window.seek(t) puts every element where it belongs at
  time t (seconds); render.mjs steps through it frame by frame.
  App screens in shots/ are captures of the real app (capture.mjs) with
  stand-in map tiles and place names; the 3D jeepney is the app's own model
  (jeep3d.js, bundled from src/hero3d/jeepney.ts).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1220; font-family: "Liberation Sans", "DejaVu Sans", sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .fill { position: absolute; inset: 0; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  #bgNavy { background: radial-gradient(1100px 900px at 50% 45%, #1a3f86 0%, #0d1a36 55%, #070d1c 100%); }
  #bgYellow { background: radial-gradient(1000px 800px at 50% 45%, #ffe07a, #ffc72c 70%); clip-path: circle(0px at 540px 960px); }
  #bgLight { background: linear-gradient(180deg, #dfeafb 0%, #eef4fc 45%, #f8fafc 100%); clip-path: circle(0px at 540px 1300px); }
  #bgEnd { background: radial-gradient(1100px 900px at 50% 50%, #1a3f86 0%, #0d1a36 55%, #070d1c 100%); clip-path: circle(0px at 540px 960px); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(18px); }
  .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(11,61,145,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(11,61,145,.05) 2px, transparent 2px); background-size: 90px 90px; }

  .h { font-weight: 700; text-align: center; width: 1080px; letter-spacing: -0.02em; }
  .white { color: #fff; } .yellow { color: #ffc72c; } .navy { color: #0b3d91; } .red { color: #dc2626; }
  .shadow { text-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .mark { background: linear-gradient(180deg, transparent 58%, #ffc72c 58%, #ffc72c 92%, transparent 92%); padding: 0 8px; }

  .tag { position: absolute; padding: 16px 30px; border-radius: 22px; background: #fff; color: #0f172a; font-weight: 800; font-size: 64px; box-shadow: 0 18px 40px rgba(0,0,0,.4); white-space: nowrap; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 32px; height: 32px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 4px; }
  .tag .strike { position: absolute; left: -6%; right: -6%; top: 50%; height: 12px; background: #dc2626; border-radius: 6px; transform-origin: left center; transform: rotate(-12deg) scaleX(0); z-index: 2; }

  .pill { display: inline-block; padding: 18px 36px; border-radius: 999px; font-weight: 800; font-size: 42px; white-space: nowrap; }
  .pill-navy { background: #0b3d91; color: #fff; }
  .pill-white { background: #fff; color: #0b3d91; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .pill-yellow { background: #ffc72c; color: #0b3d91; }

  /* Phone */
  #phone { position: absolute; left: 222px; top: 480px; width: 636px; height: 1394px; }
  .bezel { position: absolute; inset: 0; border-radius: 86px; background: linear-gradient(145deg, #2b3547, #0b0f17 40%, #1c2433); box-shadow: 0 60px 120px rgba(11,30,70,.45), 0 0 0 3px #3a4558 inset; }
  .screen { position: absolute; left: 18px; top: 18px; width: 600px; height: 1358px; border-radius: 70px; overflow: hidden; background: #f8fafc; }
  .screen img { position: absolute; left: 0; top: 60px; width: 600px; height: 1298px; }
  .status { position: absolute; left: 0; top: 0; width: 600px; height: 60px; background: #fff; z-index: 4; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 54px 8px; font-weight: 700; font-size: 26px; color: #0f172a; }
  .island { position: absolute; left: 50%; top: 36px; width: 170px; height: 48px; border-radius: 30px; background: #000; transform: translateX(-50%); z-index: 5; }
  .glare { position: absolute; inset: 18px; border-radius: 70px; background: linear-gradient(120deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 30%); pointer-events: none; z-index: 6; }
  .tap { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.55); border: 5px solid rgba(11,61,145,.55); box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 7; }
  .ripple { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 6px solid #ffc72c; z-index: 7; }

  /* Headings above the phone */
  .head { position: absolute; left: 0; top: 120px; width: 1080px; text-align: center; }
  .head .step { display: inline-flex; align-items: center; justify-content: center; width: 78px; height: 78px; border-radius: 50%; background: #0b3d91; color: #ffc72c; font-weight: 800; font-size: 44px; margin-bottom: 18px; }
  .head .t { font-weight: 800; font-size: 68px; line-height: 1.05; color: #0b3d91; letter-spacing: -0.02em; padding: 0 50px; }
  .head .s { font-size: 38px; color: #334155; margin-top: 14px; }

  /* Stickers */
  .sticker { position: absolute; background: #fff; border-radius: 40px; padding: 30px 38px; box-shadow: 0 30px 70px rgba(11,30,70,.35); border: 4px solid #e2e8f0; }
  .sticker .lb { font-size: 30px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748b; white-space: nowrap; }
  .sticker .big { font-size: 112px; font-weight: 800; color: #0b3d91; letter-spacing: -0.03em; line-height: 1.02; white-space: nowrap; }
  .sticker .sm { font-size: 34px; color: #334155; margin-top: 6px; white-space: nowrap; }
  .badge { position: absolute; right: -24px; top: -34px; background: #dc2626; color: #fff; font-weight: 800; font-size: 44px; padding: 12px 24px; border-radius: 999px; box-shadow: 0 10px 24px rgba(220,38,38,.4); transform: rotate(8deg); }
  .leg { position: absolute; left: 30px; width: 400px; display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 30px; padding: 20px 26px; box-shadow: 0 20px 50px rgba(11,30,70,.3); font-size: 36px; font-weight: 700; color: #0f172a; }
  .leg .ic { font-size: 52px; }
  .leg .amt { margin-left: auto; color: #0b3d91; font-weight: 800; }
  .stamp { position: absolute; border: 10px solid #dc2626; color: #dc2626; border-radius: 26px; padding: 14px 30px; font-weight: 900; font-size: 74px; background: rgba(255,255,255,.95); letter-spacing: .02em; white-space: nowrap; }

  #jeep3d { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; }
  .url { font-family: "DejaVu Sans Mono", monospace; font-weight: 700; font-size: 44px; color: #0b3d91; background: #fff; padding: 24px 44px; border-radius: 999px; box-shadow: 0 20px 50px rgba(0,0,0,.35); white-space: nowrap; }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; }
  .chiprow { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .chip { display: inline-block; padding: 8px 18px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 30px; white-space: nowrap; }
  .sticker .mid { font-size: 64px; font-weight: 800; color: #0b3d91; line-height: 1.05; white-space: nowrap; }
  .brand { font-weight: 900; font-size: 190px; letter-spacing: -0.04em; color: #0b3d91; line-height: 1; }
</style>

</head>
<body>

<script src="jeep3d.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  in: (x) => x * x * x,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) },
}
const tw = (t, a, b, from, to, ease = E.out) => from + (to - from) * ease(seg(t, a, b))
const win = (t, a, b, c, d) => (t < a || t > d ? 0 : t < b ? E.out(seg(t, a, b)) : t <= c ? 1 : 1 - E.in(seg(t, c, d)))
function set(el, { x = 0, y = 0, s = 1, r = 0, o = 1 } = {}) {
  el.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`
  el.style.opacity = o
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'
}
function pop(el, t, a, d, extra = {}) {
  const o = win(t, a, a + 0.15, d - 0.2, d)
  const s = t < d - 0.2 ? 0.4 + 0.6 * E.back(seg(t, a, a + 0.45)) : 1 - 0.15 * seg(t, d - 0.2, d)
  set(el, { o, s, ...extra })
}
const peso = (v) => '₱' + v.toFixed(2)
const q4 = (v) => Math.round(v * 4) / 4

// ---------- Background bokeh ----------
const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647) })()
const lights = Array.from({ length: 26 }, () => {
  const el = document.createElement('div')
  el.className = 'bokeh'
  const size = 40 + rnd() * 140
  const hue = [48, 210, 0, 30][Math.floor(rnd() * 4)]
  el.style.width = el.style.height = size + 'px'
  el.style.background = `hsla(${hue}, 95%, 65%, ${0.18 + rnd() * 0.25})`
  $('bokeh').appendChild(el)
  return { el, x: rnd() * 1180 - 50, y: rnd() * 1920, v: 30 + rnd() * 90, ph: rnd() * 6 }
})

// ---------- Timeline ----------
const PHONE_IN = 7.0, PHONE_OUT = 55.3, END = 55.4
const S = 600 / 390
// [shot, start, 'slide' (navigate) | 'cut' (same screen changes)]
const screens = [
  ['home', 7.0, 'cut'],
  ['plan-empty', 9.4, 'slide'],
  ['sheet-from', 10.7, 'slide'],
  ['sheet-quiapo', 11.7, 'cut'],
  ['sheet-araneta', 13.0, 'slide'],
  ['plan-results', 14.4, 'slide'],
  ['plan-jeep-map', 18.0, 'cut'],
  ['plan-jeep-steps', 19.9, 'cut'],
  ['plan-multi', 23.0, 'slide'],
  ['plan-multi-legend', 24.6, 'cut'],
  ['plan-pin', 27.8, 'slide'],
  ['home-tiles', 31.0, 'slide'],
  ['jeep-empty', 32.6, 'slide'],
  ['jeep-1', 33.55, 'cut'],
  ['jeep-12', 33.85, 'cut'],
  ['jeep-12-disc', 36.45, 'cut'],
  ['busway', 38.8, 'slide'],
  ['rail', 40.8, 'slide'],
  ['ride-ready', 43.0, 'slide'],
  ['ride-4', 44.1, 'cut'],
  ['ride-14', 45.2, 'cut'],
  ['ride-24', 46.3, 'cut'],
  ['trip', 47.6, 'slide'],
  ['report', 51.2, 'slide'],
].map(([name, at, kind]) => {
  const img = document.createElement('img')
  img.src = `shots/${name}.png`
  $('screen').appendChild(img)
  return { img, at, kind }
})
// Taps on the real element positions (CSS px, from shots/boxes.json)
const taps = [
  { t: 9.1, x: 195, y: 298 },   // home search card
  { t: 10.4, x: 92, y: 91 },    // From field
  { t: 12.7, x: 169, y: 201 },  // Quiapo Church
  { t: 14.1, x: 169, y: 201 },  // Araneta Center-Cubao (LRT-2)
  { t: 17.7, x: 195, y: 707 },  // UV option
  { t: 24.3, x: 48, y: 462 },   // Legend
  { t: 32.3, x: 102, y: 499 },  // Jeep tile
  { t: 33.25, x: 178, y: 199 }, // distance field
  { t: 36.25, x: 44, y: 159 },  // discount switch
  { t: 43.8, x: 195, y: 604 },  // start ride
]
const heads = [
  [7.0, 9.3, '👋', 'Bayad Po! Saan ka pupunta?', 'Ruta at pamasahe sa iisang app'],
  [9.3, 14.3, '1', 'Saan ka sasakay at bababa?', 'Hanapin ang lugar o istasyon ng tren'],
  [14.3, 19.7, '2', 'Lalabas ang ruta at pamasahe', 'Jeep, UV, tren o Busway: piliin mo'],
  [19.7, 22.9, '📍', 'Alam mo kung saan sasakay', 'May landmark sa bawat hakbang'],
  [22.9, 27.7, '🎨', 'May lipat? Iba-ibang kulay', 'Legend para sa Sakay, Lipat at Baba'],
  [27.7, 30.9, '📌', 'I-pin o hilahin ang A at B', 'Igalaw lang ang mapa'],
  [30.9, 36.3, '₱', 'Pamasahe bawat sasakyan', 'Pumili, i-type ang layo, lalabas agad'],
  [36.3, 38.7, '%', 'Estudyante, Senior o PWD?', '20% diskwento, isang pindot lang'],
  [38.7, 42.9, '🚆', 'EDSA Busway at LRT/MRT', 'Piliin lang ang istasyon'],
  [42.9, 47.5, '🛰️', 'Nakasakay na? I-track sa GPS', 'Sinusukat ang layo habang bumibiyahe'],
  [47.5, 51.1, '＋', 'Ilang sakay? Total agad', 'Lahat ng sakay sa isang listahan'],
  [51.1, 55.3, '⚠', 'Na-overcharge? I-report', 'Handa na ang report para sa LTFRB 1342'],
].map(([a, b, step, title, sub]) => {
  const el = document.createElement('div')
  el.className = 'head'
  el.innerHTML = `<div class="step">${step}</div><div class="t">${title}</div><div class="s">${sub}</div>`
  $('heads').appendChild(el)
  return { el, a, b }
})
// Stickers: [id, start, end, left, top, width, html, rotation]
const STICK = [
  ['sPlan', 14.9, 17.6, 560, 1200, 480, '<div class="lb">🚆 LRT-2 · 29 min</div><div class="big">₱13.00</div><div class="sm">Quiapo → Cubao</div>', -2],
  ['sUV', 18.3, 19.8, 40, 1260, 470, '<div class="lb">🚐 UV · Diretso</div><div class="big">₱23.50</div><div class="sm">≈ 37 min</div>', 2],
  ['sMark', 20.3, 22.9, 520, 1240, 520, '<div class="lb">📍 Sumakay malapit sa</div><div class="mid">Quiapo Church</div><div class="sm">Bumaba: Gateway Mall</div>', -2],
  ['sMulti', 23.5, 27.7, 520, 1250, 520, '<div class="lb">2 lipat · ≈ 61 min</div><div class="big">₱34.50</div><div class="chiprow"><span class="chip" style="background:#ea580c">Jeep</span><span class="chip" style="background:#db2777">UV</span><span class="chip" style="background:#2563eb">MRT-3</span></div>', 2],
  ['sPin', 28.3, 30.9, 40, 1300, 460, '<div class="lb">📌 I-pin sa mapa</div><div class="mid">Igalaw lang</div><div class="sm">tapos "Itakda"</div>', -2],
  ['sFare', 34.3, 38.7, 560, 1250, 480, '<div class="lb" id="sFareLb">Jeep · 12 km</div><div class="big" id="sFareNum">₱0.00</div><div class="sm" id="sFareSm">Regular na pamasahe</div><div class="badge" id="sFareBadge">−20%</div>', -2],
  ['sBus', 39.3, 40.8, 540, 1240, 500, '<div class="lb">🚌 EDSA Busway</div><div class="big">₱58.25</div><div class="sm">Monumento → Ayala</div>', -2],
  ['sRail', 41.3, 42.9, 40, 1260, 470, '<div class="lb">🚆 MRT-3</div><div class="big">₱12.00</div><div class="sm">North Ave → Ayala</div>', 2],
  ['sRide', 44.1, 47.5, 560, 1220, 480, '<div class="lb">🛰️ GPS · live</div><div class="big" id="sRideKm">0.0 km</div><div class="sm" id="sRideSm">0:00 · ₱14.00</div>', -2],
  ['sTotal', 49.0, 51.1, 560, 1500, 480, '<div class="lb" style="color:#c3d4f5">Kabuuan</div><div class="big" id="sTotalNum" style="color:#ffc72c">₱0.00</div>', 2],
  ['sHot', 52.5, 55.3, 520, 1360, 0, '<span class="pill pill-navy" style="font-size:46px">📞 LTFRB 1342</span>', -2],
]
for (const [id, , , left, top, width, html] of STICK) {
  const el = document.createElement('div')
  el.id = id
  el.className = width ? 'sticker abs' : 'abs'
  el.style.left = left + 'px'
  el.style.top = top + 'px'
  if (width) el.style.width = width + 'px'
  el.innerHTML = html
  $('stickers').appendChild(el)
}
if ($('sTotal')) { $('sTotal').style.background = '#0b3d91'; $('sTotal').style.borderColor = '#0b3d91' }
// Trip legs and the overcharge stamp
const legs = [['🚙', 'Jeep', '₱30.00', 48.0], ['🚌', 'Busway', '₱58.25', 48.35], ['🚆', 'MRT-3', '₱12.00', 48.7]].map(([ic, name, amt, at], i) => {
  const el = document.createElement('div')
  el.className = 'leg abs'
  el.style.top = 1080 + i * 130 + 'px'
  el.innerHTML = `<span class="ic">${ic}</span>${name}<span class="amt">${amt}</span>`
  $('stickers').appendChild(el)
  return { el, at }
})
const stamp = document.createElement('div')
stamp.className = 'stamp abs'
stamp.style.left = '500px'
stamp.style.top = '1180px'
stamp.textContent = 'SOBRA ₱10.00'
$('stickers').appendChild(stamp)

const j1 = window.jeep3d.mount($('jeep3d'))
const j2 = window.jeep3d.mount($('jeep3dEnd'))

window.seek = (t) => {
  for (const l of lights) {
    const x = ((l.x - t * l.v) % 1180 + 1180) % 1180 - 50
    l.el.style.transform = `translate(${x}px, ${l.y + Math.sin(t * 0.8 + l.ph) * 30}px)`
  }
  $('bokeh').style.opacity = t < 4.4 ? 1 : t > END ? seg(t, END, END + 0.6) : 0

  // ---- S1 hook (0–4)
  if (t < 4.3) {
    const spin = -0.5 + 7.5 * (1 - Math.exp(-t * 1.2)) + t * 0.25
    const s = 0.55 + 0.45 * E.back(seg(t, 0, 0.9))
    $('jeep3d').style.transform = `translate(0px, ${500 + (1 - E.out(seg(t, 0, 0.8))) * 300}px) scale(${s})`
    $('jeep3d').style.opacity = 1 - seg(t, 3.8, 4.1)
    $('jeep3d').style.visibility = 'visible'
    j1.render(spin, 18, 14)
  } else $('jeep3d').style.visibility = 'hidden'
  pop($('h1a'), t, 0.25, 4.1)
  {
    const o = win(t, 0.75, 0.85, 3.9, 4.1)
    const s = t < 0.75 ? 2.4 : 2.4 - 1.4 * E.out(seg(t, 0.75, 0.95))
    const shake = t > 0.95 && t < 1.25 ? Math.sin(t * 90) * 10 * (1 - seg(t, 0.95, 1.25)) : 0
    set($('h1b'), { o, s, r: -3, x: shake })
  }
  ;['tag1', 'tag2', 'tag3', 'tag4'].forEach((id, i) => {
    pop($(id), t, 1.3 + i * 0.18, 4.05, { r: Math.sin(t * 3 + i) * 4 + (i % 2 ? 6 : -6), y: Math.sin(t * 2 + i) * 10 })
    $(id).querySelector('.strike').style.transform = `rotate(-12deg) scaleX(${E.out(seg(t, 2.6 + i * 0.1, 2.85 + i * 0.1))})`
  })
  set($('h1c'), { o: win(t, 2.2, 2.5, 3.8, 4.1), y: tw(t, 2.2, 2.6, 40, 0) })

  // ---- S2 brand (3.9–7)
  $('bgYellow').style.clipPath = `circle(${tw(t, 3.85, 4.35, 0, 1400, E.inOut)}px at 540px 960px)`
  pop($('b2logo'), t, 4.3, 7.05, { r: tw(t, 4.3, 4.9, -20, 0) })
  {
    const o = win(t, 4.6, 4.65, 6.85, 7.05)
    set($('b2name'), { o, s: t < 4.6 ? 2.2 : 2.2 - 1.2 * E.out(seg(t, 4.6, 4.85)), r: -2 })
  }
  set($('b2tag'), { o: win(t, 5.1, 5.4, 6.85, 7.05), y: tw(t, 5.1, 5.5, 40, 0) })
  set($('b2pill'), { o: win(t, 5.5, 5.8, 6.85, 7.05), y: tw(t, 5.5, 5.9, 40, 0) })

  // ---- Phone scenes
  $('bgLight').style.clipPath = `circle(${tw(t, 6.85, 7.4, 0, 2000, E.inOut)}px at 540px 1300px)`
  for (const h of heads) {
    const o = win(t, h.a, h.a + 0.3, h.b - 0.25, h.b)
    set(h.el, { o, y: t < h.a + 0.3 ? tw(t, h.a, h.a + 0.35, 50, 0) : tw(t, h.b - 0.25, h.b, 0, -40, E.in) })
  }
  {
    let y = tw(t, PHONE_IN, PHONE_IN + 0.7, 1500, 0, E.out) + Math.sin(t * 1.3) * 6
    if (t > PHONE_OUT - 0.4) y += tw(t, PHONE_OUT - 0.4, PHONE_OUT + 0.1, 0, 1500, E.in)
    const zoom = 1 + 0.16 * win(t, 34.4, 34.9, 38.3, 38.7)
    const ry = tw(t, PHONE_IN, PHONE_IN + 0.7, -18, 0) + Math.sin(t * 0.9) * 1.5
    const ph = $('phone')
    ph.style.transform = `perspective(2400px) translate(0px, ${y}px) rotateY(${ry}deg) scale(${zoom})`
    ph.style.transformOrigin = '318px 820px'
    ph.style.visibility = t > PHONE_IN - 0.05 && t < PHONE_OUT + 0.2 ? 'visible' : 'hidden'
  }
  let cur = -1
  screens.forEach((sc, i) => { if (t >= sc.at) cur = i })
  screens.forEach((sc, i) => {
    let o = 0, x = 0
    if (i === cur) {
      if (sc.kind === 'slide') { x = (1 - E.inOut(seg(t, sc.at, sc.at + 0.4))) * 600; o = 1 }
      else o = i === 0 ? 1 : E.out(seg(t, sc.at, sc.at + 0.12))
    } else if (i === cur - 1) {
      const nx = screens[cur]
      const p = seg(t, nx.at, nx.at + 0.4)
      if (nx.kind === 'slide') { x = -E.inOut(p) * 200; o = p < 1 ? 1 : 0 }
      else o = seg(t, nx.at, nx.at + 0.12) < 1 ? 1 : 0
    }
    sc.img.style.zIndex = i === cur ? 2 : 1
    set(sc.img, { x, o })
  })
  let tapShown = false
  for (const tp of taps) {
    if (t > tp.t - 0.4 && t < tp.t + 0.45) {
      tapShown = true
      const px = 18 + tp.x * S, py = 78 + tp.y * S
      const press = t < tp.t ? 1 - 0.18 * seg(t, tp.t - 0.12, tp.t) : 0.82 + 0.18 * seg(t, tp.t, tp.t + 0.15)
      $('tap').style.left = px + 'px'; $('tap').style.top = py + 'px'
      set($('tap'), { o: win(t, tp.t - 0.4, tp.t - 0.25, tp.t + 0.25, tp.t + 0.45), s: press })
      const rp = seg(t, tp.t, tp.t + 0.45)
      $('ripple').style.left = px + 'px'; $('ripple').style.top = py + 'px'
      set($('ripple'), { o: t >= tp.t ? 1 - rp : 0, s: 0.6 + rp * 1.6 })
    }
  }
  if (!tapShown) { set($('tap'), { o: 0 }); set($('ripple'), { o: 0 }) }

  // Stickers
  for (const [id, a, d, , , , , r] of STICK) pop($(id), t, a, d, { r })
  if (t < 36.45) {
    $('sFareNum').textContent = peso(q4(30 * E.out(seg(t, 34.35, 34.95))))
    $('sFareSm').textContent = 'Regular na pamasahe'
  } else {
    $('sFareNum').textContent = peso(q4(30 - 6 * E.out(seg(t, 36.45, 36.9))))
    $('sFareSm').textContent = 'Estudyante / Senior / PWD'
  }
  pop($('sFareBadge'), t, 36.55, 38.7, { r: 8 })
  {
    const p = seg(t, 44.15, 47.2)
    $('sRideKm').textContent = (p * 1.0).toFixed(1) + ' km'
    $('sRideSm').textContent = `0:${String(Math.round(p * 28)).padStart(2, '0')} · ₱14.00`
  }
  for (const l of legs) set(l.el, { o: win(t, l.at, l.at + 0.2, 50.8, 51.1), x: tw(t, l.at, l.at + 0.45, -500, 0, E.back), r: tw(t, l.at, l.at + 0.45, -8, 0) })
  $('sTotalNum').textContent = peso(q4(100.25 * E.out(seg(t, 49.05, 49.8))))
  {
    const a = 51.75
    const s = t < a ? 2.6 : 2.6 - 1.6 * E.out(seg(t, a, a + 0.18))
    const shake = t > a + 0.18 && t < a + 0.45 ? Math.sin(t * 100) * 8 * (1 - seg(t, a + 0.18, a + 0.45)) : 0
    set(stamp, { o: win(t, a, a + 0.05, 55.0, 55.3), s, r: -8, x: shake })
  }

  // ---- End card (55.3–60)
  $('bgEnd').style.clipPath = `circle(${tw(t, END - 0.05, END + 0.55, 0, 1400, E.inOut)}px at 540px 960px)`
  if (t > END) {
    const s = 0.6 + 0.4 * E.back(seg(t, END + 0.2, END + 1.0))
    $('jeep3dEnd').style.transform = `translate(0px, ${tw(t, END + 0.1, END + 0.9, 1000, 400)}px) scale(${s})`
    $('jeep3dEnd').style.visibility = 'visible'
    j2.render(2.2 + (t - END) * 0.9, 15.5, 15)
  } else $('jeep3dEnd').style.visibility = 'hidden'
  pop($('endLogo'), t, END + 0.4, 99)
  pop($('endTitle'), t, END + 0.55, 99)
  set($('endSub'), { o: win(t, END + 0.8, END + 1.1, 99, 100), y: tw(t, END + 0.8, END + 1.2, 30, 0) })
  pop($('p1'), t, END + 1.3, 99); pop($('p2'), t, END + 1.45, 99); pop($('p3'), t, END + 1.6, 99)
  ;['p1', 'p2', 'p3'].forEach((id) => { $(id).style.display = 'inline-block' })
  pop($('endUrl'), t, END + 1.9, 99)
  set($('endCta'), { o: win(t, END + 2.3, END + 2.6, 99, 100), y: tw(t, END + 2.3, END + 2.7, 30, 0) + (t > END + 2.8 ? Math.sin(t * 6) * 4 : 0) })

  $('flash').style.opacity = 0.5 * (win(t, 3.8, 3.88, 3.88, 4.1) + win(t, END - 0.1, END - 0.02, END - 0.02, END + 0.2))
}
window.seek(0)
</script>
</body>
</html>
